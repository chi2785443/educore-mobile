appId: com.cakale.edu.app
---
# Parent: view linked child's published result and attendance/report info.
# chinwe.eze.parent@mail.cakale.com is seeded with a linked child in JSS1A.
- runFlow:
    file: ../shared/login.yaml
    env:
      EMAIL: "chinwe.eze.parent@mail.cakale.com"
      PASSWORD: "Demo@2026!"
- tapOn: "Features"
- tapOn: "Children's Results"
- assertVisible:
    text: "Children's Results"
    timeout: 15000
- tapOn:
    index: 0
    point: "50%,25%"
- assertVisible:
    text: "First Term"
    timeout: 15000
- back
- tapOn: "Features"
- tapOn: "Children's Reports"
- assertVisible:
    text: "Children's Reports"
    timeout: 15000
- tapOn:
    index: 0
    point: "50%,25%"
- assertVisible:
    text: "Approved"
    timeout: 15000
- runFlow: ../shared/logout.yaml

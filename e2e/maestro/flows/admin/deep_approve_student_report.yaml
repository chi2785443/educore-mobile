appId: com.cakale.edu.app
---
# Admin: approve a pending student report. JSS1A has 3 seeded reports left in
# SUBMITTED status by seed-demo-school.ts, so at least one pending item is guaranteed.
# First-draft flow — refine selectors after a live run.
- runFlow:
    file: ../shared/login.yaml
    env:
      EMAIL: "test@mail.cakale.com"
      PASSWORD: "Demo@2026!"
- openLink: "cakale-edu://admin-results"
- extendedWaitUntil:
    visible: "Results Overview"
    timeout: 15000
- tapOn: "JSS 1A"
- scrollUntilVisible:
    element:
      text: "Pending"
    direction: DOWN
- tapOn:
    text: "Pending"
    index: 0
- scrollUntilVisible:
    element:
      text: "Approve"
    direction: DOWN
- tapOn: "Approve"
- extendedWaitUntil:
    visible: "Approved"
    timeout: 15000
- runFlow: ../shared/logout.yaml

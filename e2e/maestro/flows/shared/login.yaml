appId: com.cakale.edu.app
---
# Reusable login subflow. Call via `runFlow` passing EMAIL/PASSWORD env vars.
- launchApp:
    clearState: true
    permissions:
      location: allow
      camera: allow
      microphone: allow
      notifications: allow
- extendedWaitUntil:
    visible: "Skip"
    timeout: 30000
    optional: true
- tapOn:
    text: "Skip"
    optional: true
- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 15000
- tapOn:
    id: "email-input"
# Typed in halves: on a CPU-constrained emulator, inputText's per-keystroke
# simulation can be slow enough that a full email/password blows past
# Maestro's 120s per-call deadline. Splitting keeps each call comfortably short.
- evalScript: ${output.emailPart1 = EMAIL.substring(0, Math.ceil(EMAIL.length / 2))}
- evalScript: ${output.emailPart2 = EMAIL.substring(Math.ceil(EMAIL.length / 2))}
- inputText: "${output.emailPart1}"
- inputText: "${output.emailPart2}"
- tapOn:
    id: "password-input"
- evalScript: ${output.passwordPart1 = PASSWORD.substring(0, Math.ceil(PASSWORD.length / 2))}
- evalScript: ${output.passwordPart2 = PASSWORD.substring(Math.ceil(PASSWORD.length / 2))}
- inputText: "${output.passwordPart1}"
- inputText: "${output.passwordPart2}"
- hideKeyboard
- tapOn:
    id: "sign-in-button"
- extendedWaitUntil:
    visible: "Features"
    timeout: 20000

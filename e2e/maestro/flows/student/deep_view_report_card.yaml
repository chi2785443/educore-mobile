appId: com.cakale.edu.app
---
# Student: view own published First Term result/report card (seed data guarantees
# a published TermResult + approved StudentReport exists for this account).
- runFlow:
    file: ../shared/login.yaml
    env:
      EMAIL: "chioma.eze@mail.cakale.com"
      PASSWORD: "Demo@2026!"
- tapOn: "Features"
- tapOn: "My Results"
- extendedWaitUntil:
    visible: "My Results"
    timeout: 15000
- tapOn:
    index: 0
    point: "50%,25%"
- extendedWaitUntil:
    visible: "First Term"
    timeout: 15000
- extendedWaitUntil:
    visible: "Mathematics"
    timeout: 10000
- runFlow: ../shared/logout.yaml

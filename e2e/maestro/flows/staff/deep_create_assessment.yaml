appId: com.cakale.edu.app
---
# Staff: create and publish a new assessment via CreateAssessmentSheet
# (per mobile/CLAUDE.md: classroom is picked inside the sheet, not passed in).
# First-draft flow — refine selectors after a live run.
- runFlow:
    file: ../shared/login.yaml
    env:
      EMAIL: "ifeoma.chukwu@mail.cakale.com"
      PASSWORD: "Demo@2026!"
- tapOn: "Features"
- tapOn: "Assessments"
- extendedWaitUntil:
    visible: "Assessments"
    timeout: 15000
- tapOn:
    id: "create-assessment-fab"
    optional: true
- tapOn:
    text: "+"
    optional: true
- tapOn: "JSS 1A"
- tapOn: "Mathematics"
- tapOn:
    id: "assessment-title-input"
- inputText: "E2E Smoke Test"
- tapOn: "Test"
- tapOn: "Save"
- extendedWaitUntil:
    visible: "E2E Smoke Test"
    timeout: 15000
- runFlow: ../shared/logout.yaml

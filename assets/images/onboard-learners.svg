  <g fill="#2dd4bf">
    <circle cx="98" cy="60" r="2.5"/>
    <circle cx="88" cy="72" r="1.5"/>
    <circle cx="110" cy="74" r="1.5"/>
    <circle cx="240" cy="60" r="2.5"/>
    <circle cx="250" cy="72" r="1.5"/>
    <circle cx="230" cy="72" r="1.5"/>
    <circle cx="100" cy="225" r="2"/>
    <circle cx="240" cy="225" r="2"/>

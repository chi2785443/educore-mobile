    <rect width="90" height="60" rx="12" fill="none" stroke="rgba(20,184,166,0.3)" stroke-width="1"/>
    <text x="10" y="18" font-size="8" fill="rgba(255,255,255,0.4)" font-family="Arial">Timetable</text>
    <rect x="10" y="24" width="10" height="30" rx="2" fill="rgba(20,184,166,0.25)"/>

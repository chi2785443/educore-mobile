  <path d="M180 160 Q202 158 225 160" stroke="rgba(52,211,153,0.25)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M180 170 Q202 168 224 170" stroke="rgba(52,211,153,0.2)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M180 180 Q200 178 223 180" stroke="rgba(52,211,153,0.15)" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Graduation cap — top centre -->
  <g transform="translate(148, 44)">

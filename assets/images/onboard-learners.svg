    <text x="10" y="42" font-size="9" fill="rgba(255,255,255,0.5)" font-family="Arial">Progress</text>
    <text x="62" y="42" font-size="9" fill="#2dd4bf" font-family="Arial">80%</text>
    <rect x="10" y="46" width="70" height="4" rx="2" fill="rgba(255,255,255,0.06)"/>
    <rect x="10" y="46" width="30" height="4" rx="2" fill="rgba(20,184,166,0.4)"/>

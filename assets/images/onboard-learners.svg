    <rect x="38" y="32" width="10" height="22" rx="2" fill="rgba(20,184,166,0.25)"/>
    <rect x="52" y="24" width="10" height="30" rx="2" fill="rgba(20,184,166,0.45)"/>
    <rect x="66" y="30" width="10" height="24" rx="2" fill="rgba(20,184,166,0.3)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 300" width="340" height="300">
  <!-- Soft background -->
  <circle cx="170" cy="150" r="120" fill="rgba(225,29,72,0.05)"/>
  <circle cx="170" cy="150" r="80" fill="rgba(225,29,72,0.05)"/>

  <!-- Central connection hub -->
  <circle cx="170" cy="148" r="28" fill="#3b0a1e"/>
  <circle cx="170" cy="148" r="28" fill="none" stroke="rgba(225,29,72,0.4)" stroke-width="1.5"/>
  <!-- Heart in centre -->
  <path d="M170 162 C158 152 150 145 150 138 C150 132 155 128 162 131 C165 132 168 135 170 138 C172 135 175 132 178 131 C185 128 190 132 190 138 C190 145 182 152 170 162 Z" fill="#e11d48"/>

  <!-- Left figure (parent) -->
  <circle cx="78" cy="110" r="22" fill="#3b0a1e"/>
  <circle cx="78" cy="110" r="22" fill="none" stroke="rgba(225,29,72,0.3)" stroke-width="1.5"/>
  <!-- Parent icon -->
  <circle cx="78" cy="104" r="7" fill="#fb7185"/>
  <path d="M62 126 Q62 116 78 116 Q94 116 94 126" fill="#be123c"/>

  <!-- Right figure (child/student) -->
  <circle cx="262" cy="110" r="22" fill="#3b0a1e"/>
  <circle cx="262" cy="110" r="22" fill="none" stroke="rgba(225,29,72,0.3)" stroke-width="1.5"/>
  <!-- Student icon with cap -->
  <circle cx="262" cy="104" r="7" fill="#fb7185"/>
  <polygon points="252,98 262,94 272,98 262,102" fill="#e11d48"/>
  <path d="M246 126 Q246 116 262 116 Q278 116 278 126" fill="#be123c"/>

  <!-- Connection lines (dotted arcs) -->
  <path d="M100 120 Q140 90 143 148" fill="none" stroke="rgba(225,29,72,0.3)" stroke-width="1.5" stroke-dasharray="5 5"/>
  <path d="M240 120 Q200 90 197 148" fill="none" stroke="rgba(225,29,72,0.3)" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- Floating chat bubbles -->
  <!-- Bubble 1 — parent side -->
  <g transform="translate(20,150)">
    <rect width="88" height="36" rx="12" fill="#3b0a1e"/>
    <rect width="88" height="36" rx="12" fill="none" stroke="rgba(225,29,72,0.35)" stroke-width="1"/>
    <polygon points="88,16 96,22 88,24" fill="#3b0a1e"/>
    <rect x="10" y="10" width="60" height="4" rx="2" fill="rgba(251,113,133,0.3)"/>
    <rect x="10" y="18" width="44" height="4" rx="2" fill="rgba(251,113,133,0.2)"/>
    <circle cx="76" cy="18" r="6" fill="rgba(225,29,72,0.25)"/>
    <text x="73" y="21" font-size="8" fill="#fb7185" font-family="Arial">😊</text>
  </g>

  <!-- Bubble 2 — school side top -->
  <g transform="translate(80,48)">
    <rect width="72" height="32" rx="10" fill="#2d0a1a"/>
    <rect width="72" height="32" rx="10" fill="none" stroke="rgba(225,29,72,0.3)" stroke-width="1"/>
    <polygon points="12,0 20,-8 28,0" fill="#2d0a1a"/>
    <text x="10" y="14" font-size="8" fill="rgba(251,113,133,0.7)" font-family="Arial">Announcement</text>
    <rect x="10" y="19" width="52" height="3" rx="1.5" fill="rgba(251,113,133,0.2)"/>
  </g>

  <!-- Bubble 3 — student side -->
  <g transform="translate(232,150)">
    <rect width="88" height="36" rx="12" fill="#3b0a1e"/>
    <rect width="88" height="36" rx="12" fill="none" stroke="rgba(225,29,72,0.35)" stroke-width="1"/>
    <polygon points="0,16 -8,22 0,24" fill="#3b0a1e"/>
    <rect x="18" y="10" width="52" height="4" rx="2" fill="rgba(251,113,133,0.3)"/>
    <rect x="18" y="18" width="36" height="4" rx="2" fill="rgba(251,113,133,0.2)"/>
    <circle cx="12" cy="18" r="6" fill="rgba(225,29,72,0.25)"/>
    <text x="9" y="21" font-size="8" fill="#fb7185" font-family="Arial">📚</text>
  </g>

  <!-- Notification badge floating top right -->
  <g transform="translate(256,52)">
    <rect width="62" height="38" rx="10" fill="#3b0a1e"/>
    <rect width="62" height="38" rx="10" fill="none" stroke="rgba(245,158,11,0.35)" stroke-width="1"/>
    <circle cx="16" cy="19" r="8" fill="rgba(245,158,11,0.2)"/>
    <!-- Bell icon -->
    <path d="M11 17 Q11 13 16 13 Q21 13 21 17 L21 21 L11 21 Z" fill="#fbbf24"/>
    <path d="M13 21 Q13 23 16 23 Q19 23 19 21" fill="none" stroke="#fbbf24" stroke-width="1.2"/>
    <rect x="30" y="13" width="22" height="3" rx="1.5" fill="rgba(255,255,255,0.12)"/>
    <rect x="30" y="20" width="16" height="3" rx="1.5" fill="rgba(255,255,255,0.08)"/>
    <!-- Badge -->
    <circle cx="55" cy="10" r="5" fill="#e11d48"/>
    <text x="52" y="13" font-size="7" fill="#fff" font-family="Arial" font-weight="700">3</text>
  </g>

  <!-- School bell top centre -->
  <g transform="translate(150,22)">
    <circle cx="20" cy="20" r="18" fill="#2d0a1a"/>
    <circle cx="20" cy="20" r="18" fill="none" stroke="rgba(225,29,72,0.25)" stroke-width="1"/>
    <path d="M12 18 Q12 12 20 12 Q28 12 28 18 L28 24 L12 24 Z" fill="#fb7185"/>
    <path d="M14 24 Q14 27 20 27 Q26 27 26 24" fill="none" stroke="#fb7185" stroke-width="2"/>
    <line x1="20" y1="10" x2="20" y2="7" stroke="rgba(251,113,133,0.5)" stroke-width="1.5"/>
  </g>

  <!-- Progress / result bottom -->
  <rect x="95" y="222" width="150" height="46" rx="14" fill="#2d0a1a"/>
  <rect x="95" y="222" width="150" height="46" rx="14" fill="none" stroke="rgba(225,29,72,0.3)" stroke-width="1"/>
  <text x="112" y="241" font-size="9" fill="rgba(255,255,255,0.4)" font-family="Arial">Result Published 🎉</text>
  <rect x="112" y="248" width="110" height="5" rx="2.5" fill="rgba(255,255,255,0.07)"/>
  <rect x="112" y="248" width="88" height="5" rx="2.5" fill="#e11d48"/>
  <text x="200" y="256" font-size="8" fill="rgba(251,113,133,0.8)" font-family="Arial">80%</text>

  <!-- Sparkles scattered -->
  <g fill="#fb7185">
    <circle cx="55" cy="200" r="2.5"/>
    <circle cx="45" cy="210" r="1.5"/>
    <circle cx="65" cy="212" r="1.5"/>
    <circle cx="285" cy="200" r="2.5"/>
    <circle cx="275" cy="212" r="1.5"/>
    <circle cx="295" cy="212" r="1.5"/>
  </g>
</svg>
